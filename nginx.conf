# This container is a standalone deployment of the DXB platform. It is NOT part
# of bamap and must never be served under the bamap domain: bamap already owns
# /admin and /grow behind its own Basic auth, so mounting this app under that
# domain would collide with it. Give this container its own Darkube app and its
# own subdomain.
server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # The passenger site.
  location = / {
    try_files /index.html =404;
  }

  # The Operations Control Center. Named /occ rather than /admin so the path
  # cannot be confused with bamap's own admin panel. It is the same shell as the
  # passenger site, served under its own URL so the two surfaces can be linked
  # and bookmarked separately. Sign-in state is stored under separate keys, so
  # being signed in to one never signs you in to the other.
  location /occ {
    try_files /index.html =404;
  }

  # CrewFlow is a separate bundled app with its own client-side router.
  location /crew-app/ {
    try_files $uri $uri/ /crew-app/index.html;
  }

  # Everything else is a real file: assets, page fragments, the sub-apps.
  location / {
    try_files $uri $uri/ =404;
  }

  # Page fragments are fetched at runtime and change often during the demo, so
  # they must never be served stale.
  location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
