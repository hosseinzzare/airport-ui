<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The platform is mounted under /dxb on the shared domain, and the same shell
       answers both /dxb and /dxb-admin. Pinning the base here keeps every relative
       asset path and runtime fragment fetch resolving against that mount point
       rather than against whichever URL the visitor happens to be on. -->
  <base href="/dxb/">
  <title>DXB Airport Platform · Customer & OCC</title>
  <meta name="description" content="Emirates customer portal and Dubai Airport Operations Control Center">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/tower-hub.css">
</head>
<body>

  <div id="app-viewport">

    <!-- Customer portal strip (signed-in passengers) -->
    <div class="customer-portal-bar" id="customer-portal-bar">
      <div>
        Welcome, <strong id="customer-portal-name">Guest</strong>
        <span style="opacity:0.7; margin-left:8px;">Customer portal</span>
      </div>
      <div class="customer-portal-links">
        <button type="button" data-customer-route="landing" onclick="switchRoute('landing')">Book</button>
        <button type="button" data-customer-route="my-trips" onclick="switchRoute('my-trips')">My Trips</button>
        <button type="button" data-customer-route="manage" onclick="switchRoute('manage')">Manage booking</button>
        <button type="button" data-customer-route="flight-status" onclick="switchRoute('flight-status')">Flight status</button>
        <button type="button" onclick="window.location.href='./crew-app/#/login'">CrewFlow</button>
        <button type="button" id="btn-customer-logout">Sign out</button>
      </div>
    </div>

    <!-- Public utility strip -->
    <div class="emirates-top-strip" id="public-top-strip">
      <div style="display: flex; gap: 16px; align-items: center;">
        <span class="emirates-top-link">United Kingdom (English)</span>
        <span class="emirates-top-link">GBP (£)</span>
      </div>
      <div class="emirates-top-links">
        <span class="emirates-top-link" onclick="switchRoute('signin')">Emirates Skywards Login</span>
        <span class="emirates-top-link" onclick="switchRoute('staff-login')">Staff / OCC</span>
        <span class="caption-text" style="color: var(--color-gold-bright); font-weight: 600;" id="user-status-display">Guest</span>
      </div>
    </div>

    <!-- Customer header -->
    <header class="emirates-main-header" id="public-header">
      <div class="emirates-brand-group">
        <div class="emirates-red-logo" onclick="switchRoute('landing')">
          <span class="emirates-logo-text">Emirates</span>
          <span class="emirates-logo-sub">FLY BETTER</span>
        </div>
        <nav class="emirates-nav-menu" id="public-main-nav">
          <a class="emirates-nav-item active" onclick="switchRoute('landing')">BOOK</a>
          <a class="emirates-nav-item" onclick="switchRoute('manage')">MANAGE</a>
          <a class="emirates-nav-item" onclick="switchRoute('portal')">CHECK-IN</a>
          <a class="emirates-nav-item" onclick="switchRoute('flight-status')">FLIGHT STATUS</a>
          <a class="emirates-nav-item" onclick="switchRoute('signin')" style="color: var(--color-gold);">SKYWARDS</a>
          <a class="emirates-nav-item" onclick="window.location.href='./crew-app/#/crew'">CREW</a>
        </nav>
      </div>
      <div class="emirates-user-actions" id="user-actions-container">
        <button class="btn-header-signin" onclick="switchRoute('signin')">Sign In</button>
        <button class="btn-header-signup" onclick="switchRoute('signup')">Sign Up</button>
      </div>
    </header>

    <!-- Legacy strip kept for compatibility (hidden when ops shell active) -->
    <nav class="module-selector-strip" id="admin-module-strip" style="display: none;"></nav>

    <!-- Customer / public content -->
    <main id="main-content" class="content-area"></main>

    <!-- Operations shell (staff roles) -->
    <div class="ops-shell" id="ops-shell">
      <aside class="ops-sidebar">
        <div class="ops-brand">
          <div class="ops-brand-mark" aria-hidden="true"></div>
          <div>
            <h1>DXB Smart Hub</h1>
            <span>Operations Control</span>
          </div>
        </div>
        <nav id="ops-nav" aria-label="OCC modules"></nav>
        <div class="ops-sidebar-footer">
          <div class="ops-role-badge" id="ops-role-badge">ROLE</div>
          <button type="button" class="ops-nav-btn" onclick="handleStaffLogout()">
            <span class="ops-ico">⎋</span> Sign out
          </button>
        </div>
      </aside>
      <div class="ops-main">
        <div class="ops-topbar">
          <div>
            <h2 id="ops-page-title">Dashboard</h2>
            <div class="ops-meta" id="ops-page-meta">DXB OCC</div>
          </div>
          <div class="ops-meta" id="ops-clock">--:--:--Z</div>
        </div>
        <div class="ops-content" id="ops-content"></div>
      </div>
    </div>

    <!-- Passenger app tab bar — mobile navigation -->
    <nav class="bottom-nav" id="public-bottom-nav">
      <a href="#" class="bottom-nav-item active" data-nav="home" onclick="event.preventDefault(); switchRoute('landing');">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.7 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/></svg>
        </span>
        <span>Book</span>
      </a>

      <a href="#" class="bottom-nav-item" data-nav="my-trips" onclick="event.preventDefault(); switchRoute('my-trips');">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        </span>
        <span>My Trips</span>
      </a>

      <a href="#" class="bottom-nav-item" data-nav="portal" onclick="event.preventDefault(); switchRoute('portal');">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-4z"/><path d="M9 6v10"/></svg>
        </span>
        <span>Pass</span>
      </a>

      <a href="#" class="bottom-nav-item" data-nav="signin" onclick="event.preventDefault(); switchRoute('signin');">
        <span class="bottom-nav-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span>Account</span>
      </a>
    </nav>
  </div>

<!-- Application Engine JavaScript -->

<script src="js/roles.js"></script>
<script src="js/tower-hub.js"></script>
<script src="js/gate-intelligence.js"></script>
<script src="js/app.js"></script>
</body>
</html>
