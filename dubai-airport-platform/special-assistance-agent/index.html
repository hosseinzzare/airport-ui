<!DOCTYPE html>
<!--
  DXB Special Assistance — Agent companion (Surface C, standalone)
  ------------------------------------------------------------------------
  A focused, mobile-first operational tool for the assistance AGENT who
  executes a request the OCC Coordinator has assigned to them.

  • Reads & writes the SAME shared store (../shared/assist-store.js →
    localStorage DXB_ASSIST_REQUESTS) as the Passenger and OCC surfaces.
  • Shows ONLY requests assigned to the current agent. No queue browsing,
    no self-assignment, no unrelated requests.
  • Advances the lifecycle through the additive agent helpers
    (acceptAssignment → startEnRoute → locatePassenger → startAssistance →
    completeAssistance) so OCC and passenger tracking reflect every step.
  • Agent identity is treated as coming from the session (default AG-21).
    The small "Demo" strip at the very top is a development-only control
    for testing other agents — deliberately separated from the core UX.
-->
<html lang="en">
<head>
  <!-- Pinned so the relative asset links below resolve against this
       app's own folder, with or without a trailing slash in the URL. -->
  <base href="/dxb/special-assistance-agent/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Assistance Agent · Dubai International (DXB)</title>
  <meta name="description" content="Execute special assistance tasks assigned to you at Dubai International Airport." />

  <link rel="stylesheet" href="../css/design-system.css" />

  <style>
    /* ---- Scoped to #sag-app; reuses shared tokens ---------------------- */

    html { background: #EDEBE7; }
    body {
      background: #EDEBE7;
      /* grow with content; min-height fills short viewports (see passenger app) */
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }
    #sag-app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    @media (min-width: 460px) {
      #sag-app { border-left: var(--border-standard); border-right: var(--border-standard); box-shadow: var(--shadow-emirates); }
    }

    /* Development-only identity strip — visually distinct from the product */
    #sag-app .sag-demo {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      background: #2B2B2B; color: #E8E8E8;
      font-size: 11.5px; font-weight: 600;
      border-bottom: 1px solid #000;
      white-space: nowrap;
    }
    #sag-app .sag-demo .sag-demo-lbl { overflow: hidden; text-overflow: ellipsis; }
    #sag-app .sag-demo .sag-demo-tag { letter-spacing: .06em; text-transform: uppercase; color: var(--color-gold-bright); font-weight: 700; }
    #sag-app .sag-demo select {
      margin-left: auto; appearance: none;
      background: #3A3A3A; color: #fff; border: 1px dashed #6a6a6a;
      border-radius: 6px; padding: 4px 24px 4px 8px; font-size: 11.5px; font-weight: 600;
      font-family: var(--font-family); cursor: pointer;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23bbb' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
      background-repeat: no-repeat; background-position: right 8px center;
    }

    /* App bar (sticky) */
    #sag-app .sag-appbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px var(--page-padding);
      background: var(--bg-surface);
      border-bottom: var(--border-standard);
      position: sticky; top: 0; z-index: 5;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    #sag-app .sag-back {
      appearance: none; border: var(--border-standard); background: var(--bg-surface);
      width: 40px; height: 40px; border-radius: var(--radius-button);
      font-size: 20px; line-height: 1; cursor: pointer; color: var(--text-main);
      display: none; align-items: center; justify-content: center; flex: 0 0 auto;
    }
    #sag-app .sag-appbar-titles { min-width: 0; }
    #sag-app .sag-appbar h1 { font-size: 18px; line-height: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sag-app .sag-appbar .sag-appbar-sub { font-size: 12px; color: var(--text-secondary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sag-app .sag-appbar .sag-me {
      margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
    }
    #sag-app .sag-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--color-primary); color: #fff;
      font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    }

    /* Scroll region */
    #sag-app .sag-scroll { flex: 1 0 auto; padding: var(--page-padding); padding-bottom: 20px; }

    /* Section label */
    #sag-app .sag-sec {
      font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-dim); font-weight: 700; margin: 4px 0 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #sag-app .sag-sec .sag-sec-n { color: var(--text-secondary); }

    /* Task card (My Work) */
    #sag-app .sag-card {
      display: block; width: 100%; text-align: left; cursor: pointer;
      font-family: var(--font-family);
      background: var(--bg-surface); border: var(--border-standard);
      border-left: 3px solid var(--border-color);
      border-radius: var(--radius-card); padding: 14px; margin-bottom: 10px;
      box-shadow: var(--shadow-subtle);
      transition: box-shadow .12s ease, border-color .12s ease;
    }
    #sag-app .sag-card:hover { box-shadow: var(--shadow-emirates); }
    #sag-app .sag-card.is-new { border-left-color: var(--color-primary); background: #FFFDFD; }
    #sag-app .sag-card.lane-active { border-left-color: var(--color-info); }
    #sag-app .sag-card.lane-risk { border-left-color: var(--color-warning); }
    #sag-app .sag-card.lane-done { border-left-color: var(--border-color); opacity: .7; }
    #sag-app .sag-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #sag-app .sag-card-idl { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #sag-app .sag-card-pax { font-size: 16px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sag-app .sag-card-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #sag-app .sag-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
    #sag-app .sag-next { font-size: 13px; font-weight: 700; color: var(--color-primary); display: inline-flex; align-items: center; gap: 5px; }
    #sag-app .sag-card.lane-done .sag-next { color: var(--text-dim); }

    /* Priority badge */
    #sag-app .sag-prio {
      display: inline-flex; align-items: center; justify-content: center;
      height: 20px; min-width: 26px; padding: 0 6px; border-radius: 6px;
      font-size: 11px; font-weight: 700; flex: 0 0 auto; border: 1px solid transparent;
    }
    #sag-app .sag-prio.p1 { background: var(--color-error); color: #fff; }
    #sag-app .sag-prio.p2 { background: var(--bg-warning); color: var(--color-warning); border-color: var(--border-warning); }
    #sag-app .sag-prio.p3 { background: var(--bg-secondary); color: var(--text-secondary); border-color: var(--border-color); }
    #sag-app .sag-prio.p4 { background: var(--bg-secondary); color: var(--text-dim); border-color: var(--border-color); }

    /* SLA / timing pill */
    #sag-app .sag-time { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    #sag-app .sag-time.is-risk { color: var(--color-warning); }
    #sag-app .sag-time.is-breach { color: var(--color-error); }

    /* Need mini-icons on a card */
    #sag-app .sag-needline { display: inline-flex; align-items: center; gap: 4px; }
    #sag-app .sag-needline .sag-need-ic { font-size: 15px; }

    /* ---- Active Task ---- */
    #sag-app .sag-task-head { margin-bottom: 4px; }
    #sag-app .sag-task-name { font-size: 24px; line-height: 30px; font-weight: 700; color: var(--text-main); }
    #sag-app .sag-task-sub { font-size: 13.5px; color: var(--text-secondary); margin-top: 3px; }
    #sag-app .sag-task-badges { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

    #sag-app .sag-panel {
      background: var(--bg-surface); border: var(--border-standard);
      border-radius: var(--radius-card); padding: 16px; margin-top: 16px; box-shadow: var(--shadow-subtle);
    }
    #sag-app .sag-panel-t { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); font-weight: 700; margin-bottom: 12px; }

    /* "Your task" — the prominent, agent-specific responsibility */
    #sag-app .sag-task-panel { border-left: 3px solid var(--color-primary); }
    #sag-app .sag-task-title { font-size: 17px; line-height: 23px; font-weight: 700; color: var(--text-main); }
    #sag-app .sag-task-instr { font-size: 14px; line-height: 20px; color: var(--text-secondary); margin-top: 8px; }
    #sag-app .sag-task-route { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; font-weight: 600; color: var(--text-main); flex-wrap: wrap; }
    #sag-app .sag-task-route .sag-arrow { color: var(--text-dim); }
    #sag-app .sag-task-route .sag-pt { display: inline-flex; align-items: center; gap: 5px; }
    #sag-app .sag-task-kv { margin-top: 12px; }
    #sag-app .sag-task-kv .sag-tk { display: block; font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 2px; }
    #sag-app .sag-task-kv .sag-tv { display: block; font-size: 15px; color: var(--text-main); font-weight: 700; }

    /* Where & when — the meet block */
    #sag-app .sag-meet { display: flex; flex-direction: column; gap: 14px; }
    #sag-app .sag-meet-row { display: flex; align-items: flex-start; gap: 12px; }
    #sag-app .sag-meet-ic {
      width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
      display: inline-flex; align-items: center; justify-content: center; font-size: 17px;
      background: var(--bg-secondary); border: var(--border-standard);
    }
    #sag-app .sag-meet-k { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    #sag-app .sag-meet-v { font-size: 15.5px; color: var(--text-main); font-weight: 700; }
    #sag-app .sag-meet-v .sag-time { font-size: 15.5px; }

    /* Needs */
    #sag-app .sag-needs { display: flex; flex-direction: column; gap: 8px; }
    #sag-app .sag-need {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-secondary); border: var(--border-standard);
      border-radius: var(--radius-button); padding: 10px 12px;
    }
    #sag-app .sag-need .sag-need-ic { font-size: 20px; width: 24px; text-align: center; flex: 0 0 auto; }
    #sag-app .sag-need .sag-need-l { font-size: 14.5px; font-weight: 600; color: var(--text-main); }
    #sag-app .sag-need .sag-need-code { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: .03em; }
    #sag-app .sag-note { color: var(--text-secondary); font-size: 14px; margin-top: 12px; font-style: italic; }

    /* Journey stepper */
    #sag-app .sag-steps { list-style: none; margin: 0; padding: 0; }
    #sag-app .sag-step { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 14px; position: relative; }
    #sag-app .sag-step:last-child { padding-bottom: 0; }
    #sag-app .sag-step:not(:last-child)::before {
      content: ""; position: absolute; left: 12px; top: 26px; bottom: -2px; width: 2px; background: var(--border-color);
    }
    #sag-app .sag-step.is-done:not(:last-child)::before { background: var(--color-success); }
    #sag-app .sag-step .sag-dot {
      width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
      border: 2px solid var(--border-color); background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-dim); z-index: 1;
    }
    #sag-app .sag-step.is-done .sag-dot { background: var(--color-success); border-color: var(--color-success); color: #fff; }
    #sag-app .sag-step.is-current .sag-dot { border-color: var(--color-primary); color: var(--color-primary); box-shadow: 0 0 0 4px rgba(215,26,33,0.12); }
    #sag-app .sag-step .sag-step-l { font-size: 14.5px; font-weight: 600; color: var(--text-dim); padding-top: 2px; }
    #sag-app .sag-step.is-done .sag-step-l, #sag-app .sag-step.is-current .sag-step-l { color: var(--text-main); }
    #sag-app .sag-step.is-current .sag-step-l { color: var(--color-primary); }

    /* Exception banner (reported issue) */
    #sag-app .sag-exc {
      display: flex; gap: 10px; align-items: flex-start;
      background: var(--bg-error); border: 1px solid var(--border-error);
      color: var(--color-error); border-radius: var(--radius-card); padding: 12px 14px; margin-top: 16px;
    }
    #sag-app .sag-exc .sag-exc-t { font-weight: 700; }
    #sag-app .sag-exc .sag-exc-sub { font-size: 12.5px; opacity: .9; }

    /* Report-issue control */
    #sag-app .sag-report-btn {
      appearance: none; font-family: var(--font-family); cursor: pointer;
      width: 100%; height: 46px; margin-top: 16px; border-radius: var(--radius-button);
      background: var(--bg-surface); border: var(--border-standard); color: var(--color-error);
      font-weight: 700; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    #sag-app .sag-report-btn:hover { border-color: var(--border-error); background: var(--bg-error); }
    #sag-app .sag-report-panel { margin-top: 16px; }
    #sag-app .sag-report-panel .input-group { margin-bottom: 12px; }
    #sag-app .sag-report-actions { display: flex; gap: 10px; }
    #sag-app .sag-report-actions .btn-secondary,
    #sag-app .sag-report-actions .btn-primary { width: auto; flex: 1 1 0; }

    /* Completed / closed banner */
    #sag-app .sag-done {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-success); border: 1px solid var(--border-success); color: var(--color-success);
      border-radius: var(--radius-card); padding: 16px; font-weight: 700; margin-bottom: 4px;
    }
    #sag-app .sag-done.is-cancel { background: var(--bg-error); border-color: var(--border-error); color: var(--color-error); }
    #sag-app .sag-done .sag-done-ic { font-size: 24px; line-height: 1; }

    /* Sticky primary action */
    #sag-app #sag-cta-host { position: sticky; bottom: 0; z-index: 5; }
    #sag-app .sag-cta {
      padding: 12px var(--page-padding);
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--bg-surface); border-top: var(--border-standard);
      box-shadow: 0 -4px 10px rgba(0,0,0,0.06);
    }
    #sag-app .sag-cta .btn-primary { height: 54px; font-size: 17px; }
    #sag-app .sag-cta .btn-secondary { height: 50px; }
    #sag-app .sag-cta .sag-cta-hint { display: block; text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }

    /* Empty state */
    #sag-app .sag-empty { text-align: center; color: var(--text-secondary); padding: 48px 20px; }
    #sag-app .sag-empty .sag-empty-ic { font-size: 40px; display: block; margin-bottom: 12px; }
    #sag-app .sag-empty .sag-empty-t { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }

    /* Chip sizing inside this app */
    #sag-app .chip { font-size: 12.5px; }

    /* Focus visibility */
    #sag-app button:focus-visible, #sag-app select:focus-visible,
    #sag-app input:focus-visible, #sag-app textarea:focus-visible {
      outline: 3px solid rgba(215,26,33,0.45); outline-offset: 2px;
    }

    /* Toast */
    #sag-app .sag-toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: var(--text-main); color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 14px; font-weight: 600; box-shadow: var(--shadow-emirates); z-index: 60; opacity: 0;
      transition: opacity .2s ease; pointer-events: none; max-width: 88%; text-align: center;
    }
    #sag-app .sag-toast.is-show { opacity: 1; }

    #sag-app .visually-hidden {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <main id="sag-app" aria-live="polite">
    <div class="sag-demo" id="sag-demo"><!-- dev-only identity switcher --></div>

    <header class="sag-appbar">
      <button type="button" class="sag-back" id="sag-back" aria-label="Back to my work">←</button>
      <div class="sag-appbar-titles">
        <h1 id="sag-title">My work</h1>
        <div class="sag-appbar-sub" id="sag-sub">Dubai International · DXB</div>
      </div>
      <span class="sag-me" id="sag-me"></span>
    </header>

    <div class="sag-scroll" id="sag-scroll"><!-- rendered by JS --></div>
    <div id="sag-cta-host"><!-- sticky action rendered by JS --></div>
    <div class="sag-toast" id="sag-toast" role="status" aria-live="polite"></div>
  </main>

  <script src="../shared/assist-store.js"></script>
  <script>
  (function () {
    'use strict';

    var S = window.AssistStore;
    var scroll = document.getElementById('sag-scroll');
    var ctaHost = document.getElementById('sag-cta-host');
    var backBtn = document.getElementById('sag-back');
    var titleEl = document.getElementById('sag-title');
    var subEl = document.getElementById('sag-sub');
    var meEl = document.getElementById('sag-me');
    var demoEl = document.getElementById('sag-demo');

    var AGENT_KEY = 'DXB_ASSIST_AGENT';           // own key — never touches request state
    var DEFAULT_AGENT = 'AG-21';                   // in a real product this comes from the session

    var state = { view: 'list', selectedId: null, reportOpen: false, handoffOpen: false };

    // Exception types an agent can report from the field.
    var EXC_TYPES = [
      { v: 'passenger_not_found', l: 'Passenger not found' },
      { v: 'gate_changed',        l: 'Gate / flight changed' },
      { v: 'assistance_changed',  l: 'Assistance needs changed' },
      { v: 'handoff_failed',      l: 'Handoff failed' },
      { v: 'sla_risk',            l: 'Running late / SLA risk' }
    ];

    /* ---- identity (session-simulated) ---------------------------------- */
    function currentAgentId() {
      var id = null;
      try { id = localStorage.getItem(AGENT_KEY); } catch (e) {}
      if (!id || !S.agentById(id)) { id = DEFAULT_AGENT; setAgent(id); }
      return id;
    }
    function setAgent(id) { try { localStorage.setItem(AGENT_KEY, id); } catch (e) {} }
    var ME = currentAgentId();
    function me() { return S.agentById(ME) || { id: ME, name: ME, zone: '' }; }

    /* ---- utils --------------------------------------------------------- */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
      });
    }
    function initials(name) {
      return String(name || '?').trim().split(/\s+/).slice(0, 2)
        .map(function (w) { return w.charAt(0) || ''; }).join('').toUpperCase() || '?';
    }
    function prioClass(p) { return String(p || 'P3').toLowerCase(); }
    function slaState(r) { return (r.sla && r.sla.state) || 'on_track'; }
    function slaClass(st) { return st === 'at_risk' ? ' is-risk' : (st === 'breached' ? ' is-breach' : ''); }

    function statusChip(status) {
      var map = {
        ASSIGNED:         ['chip-warning', '🔔', 'New assignment'],
        ACCEPTED:         ['chip-info', '👤', 'Accepted'],
        EN_ROUTE:         ['chip-in-progress', '→', 'On the way'],
        PASSENGER_LOCATED:['chip-in-progress', '📍', 'Passenger located'],
        IN_PROGRESS:      ['chip-in-progress', '⧗', 'Assisting'],
        COMPLETED:        ['chip-completed', '✓', 'Completed'],
        CANCELLED:        ['chip-blocked', '✕', 'Cancelled'],
        REQUESTED:        ['chip-warning', '◷', 'Requested'],
        CONFIRMED:        ['chip-info', '✓', 'Confirmed']
      };
      var m = map[status] || ['chip-info', '•', status];
      return '<span class="chip ' + m[0] + '"><span aria-hidden="true">' + m[1] + '</span> ' + esc(m[2]) + '</span>';
    }

    // The single next action for THIS leg. At IN_PROGRESS the CTA depends on
    // whether the leg is the final one (complete the journey) or a handoff leg.
    function nextAction(leg) {
      var status = leg ? leg.status : null;
      switch (status) {
        case 'ASSIGNED':          return { label: 'Accept assignment', fn: 'accept', hint: 'Confirm you are taking this task.' };
        case 'ACCEPTED':          return { label: "I'm on my way", fn: 'enroute', hint: 'Let the passenger know help is coming.' };
        case 'EN_ROUTE':          return { label: 'Confirm passenger located', fn: 'locate', hint: 'Tap when you have found the passenger.' };
        case 'PASSENGER_LOCATED': return { label: 'Start assistance', fn: 'start', hint: 'Begin escorting / supporting the passenger.' };
        case 'IN_PROGRESS':
          return leg.isFinal
            ? { label: 'Complete assistance', fn: 'complete', hint: 'This finishes the whole assistance journey.' }
            : { label: 'Hand off passenger', fn: 'handoff-open', hint: 'Hand over at ' + (leg.destination || 'the handoff point') + '. The coordinator assigns the next agent.' };
        default: return null;
      }
    }
    function nextActionShort(leg) {
      var status = leg ? leg.status : null;
      if (status === 'IN_PROGRESS') return leg.isFinal ? 'Complete' : 'Hand off';
      var m = { ASSIGNED: 'Accept', ACCEPTED: 'Start travel', EN_ROUTE: 'Locate passenger', PASSENGER_LOCATED: 'Start assistance' };
      return m[status] || '';
    }
    function legChip(r, L, active) {
      if (active) return statusChip(L.status);
      if (r.status === 'CANCELLED') return statusChip('CANCELLED');
      if (L && L.handoff && L.handoff.status === 'done')
        return '<span class="chip chip-completed"><span aria-hidden="true">✓</span> Handed off</span>';
      return statusChip('COMPLETED');
    }

    /* ---- data (strictly scoped to this agent's assignments) ------------ */
    var PRIO_RANK = { P1: 0, P2: 1, P3: 2, P4: 3 };

    // The leg relevant to ME on a request: the current leg if I own it, else my
    // most recent leg, else (legacy request without assignments) a synthesized
    // leg from request-level fields.
    // My COMPLETED legs (a future PENDING step assigned to me is NOT yet mine to
    // see — it only appears once handoff activates it and it becomes current).
    function myCompletedLegs(r) {
      return (r.assignments || []).filter(function (a) { return a.agentId === ME && a.status === 'COMPLETED'; });
    }
    function effLeg(r) {
      var cur = S.currentAssignment(r);
      if (cur && cur.agentId === ME) return cur;
      var done = myCompletedLegs(r);
      if (done.length) return done[done.length - 1];
      if ((r.assignments || []).length === 0 && r.agentId === ME) {
        return { assignmentId: null, agentId: r.agentId, agentName: r.agentName,
          taskTitle: r.destination ? ('Escort to ' + r.destination) : 'Assist passenger',
          taskInstruction: '', pickup: r.pickup, destination: r.destination,
          isFinal: true, status: r.status, handoff: null };
      }
      return null;
    }
    // Is MY leg currently active (mine to work) vs. already handed off/closed?
    function isActiveLeg(r) {
      var cur = S.currentAssignment(r);
      if (cur && cur.agentId === ME) return cur.status !== 'COMPLETED';
      if (cur) return false; // current leg belongs to another agent
      if ((r.assignments || []).length === 0 && r.agentId === ME) {
        return ['ASSIGNED','ACCEPTED','EN_ROUTE','PASSENGER_LOCATED','IN_PROGRESS'].indexOf(r.status) !== -1;
      }
      return false;
    }
    // Involved = I am the current owner, or I have already completed a leg.
    // (Upcoming PENDING steps stay hidden until activated.)
    function involvesMe(r) {
      var cur = S.currentAssignment(r);
      if (cur && cur.agentId === ME) return true;
      if (myCompletedLegs(r).length) return true;
      if ((r.assignments || []).length === 0 && r.agentId === ME) return true;
      return false;
    }
    function mine() { return S.all().filter(involvesMe); }
    function sortActive(list) {
      return list.slice().sort(function (a, b) {
        var ra = slaState(a) === 'at_risk' || slaState(a) === 'breached' ? 0 : 1;
        var rb = slaState(b) === 'at_risk' || slaState(b) === 'breached' ? 0 : 1;
        if (ra !== rb) return ra - rb;
        var pa = PRIO_RANK[a.priority] != null ? PRIO_RANK[a.priority] : 9;
        var pb = PRIO_RANK[b.priority] != null ? PRIO_RANK[b.priority] : 9;
        if (pa !== pb) return pa - pb;
        return String(a.flight.boarding || '').localeCompare(String(b.flight.boarding || ''));
      });
    }

    /* ================= Screen: My Work ================================= */
    function renderList() {
      state.view = 'list';
      titleEl.textContent = 'My work';
      subEl.textContent = 'Dubai International · DXB';
      backBtn.style.display = 'none';
      ctaHost.innerHTML = '';
      window.scrollTo(0, 0);

      var all = mine();
      var active = sortActive(all.filter(isActiveLeg));
      var closed = all.filter(function (r) { return !isActiveLeg(r); });

      if (!active.length && !closed.length) {
        scroll.innerHTML = '<div class="sag-empty">'
          + '<span class="sag-empty-ic" aria-hidden="true">🎧</span>'
          + '<div class="sag-empty-t">No assignments right now</div>'
          + '<div>New tasks assigned to you by the OCC will appear here automatically.</div>'
          + '</div>';
        return;
      }

      var html = '';
      html += '<div class="sag-sec"><span>Active tasks</span><span class="sag-sec-n">' + active.length + '</span></div>';
      html += active.length
        ? active.map(taskCard).join('')
        : '<div class="sag-empty" style="padding:24px 8px;">Nothing active — you’re all caught up.</div>';

      if (closed.length) {
        html += '<div class="sag-sec" style="margin-top:20px;"><span>Recently closed</span><span class="sag-sec-n">' + closed.length + '</span></div>';
        html += closed.map(taskCard).join('');
      }
      scroll.innerHTML = html;

      scroll.querySelectorAll('[data-id]').forEach(function (el) {
        el.addEventListener('click', function () { openTask(el.getAttribute('data-id')); });
      });
    }

    function taskCard(r) {
      var L = effLeg(r);
      var active = isActiveLeg(r);
      var lane = !active ? 'lane-done'
        : (L && L.status === 'ASSIGNED' ? 'is-new'
          : (slaState(r) !== 'on_track' ? 'lane-risk' : 'lane-active'));
      var st = slaState(r);
      var timing = r.flight.boarding
        ? '<span class="sag-time' + slaClass(st) + '">◷ Boarding ' + esc(r.flight.boarding) + '</span>' : '';
      var needIc = (r.needs || []).slice(0, 4).map(function (k) {
        var n = S.needByKey(k); return n ? '<span class="sag-need-ic" aria-hidden="true">' + n.icon + '</span>' : '';
      }).join('');
      var task = L ? L.taskTitle : (r.pickup || '');
      var foot;
      if (active) foot = '<span class="sag-next">' + esc(nextActionShort(L)) + ' →</span>';
      else if (r.status === 'CANCELLED') foot = '<span class="sag-next">✕ Cancelled</span>';
      else if (L && L.handoff && L.handoff.status === 'done') foot = '<span class="sag-next">✓ Handed off</span>';
      else foot = '<span class="sag-next">✓ Completed</span>';

      return '<button type="button" class="sag-card ' + lane + '" data-id="' + esc(r.id) + '">'
        + '<div class="sag-card-head">'
        +   '<div class="sag-card-idl">'
        +     '<span class="sag-prio ' + prioClass(r.priority) + '">' + esc(r.priority) + '</span>'
        +     '<span class="sag-card-pax">' + esc(r.passenger.name) + '</span>'
        +   '</div>'
        +   legChip(r, L, active)
        + '</div>'
        + '<div class="sag-card-meta">'
        +   '<span class="sag-needline">' + needIc + '</span>'
        +   (task ? '<span>· ' + esc(task) + '</span>' : '')
        + '</div>'
        + '<div class="sag-card-foot">' + foot + timing + '</div>'
        + '</button>';
    }

    /* ================= Screen: Active Task ============================= */
    function openTask(id) { state.selectedId = id; state.reportOpen = false; state.handoffOpen = false; renderTask(); }

    var STATUS_STEP = { ASSIGNED: 0, ACCEPTED: 1, EN_ROUTE: 2, PASSENGER_LOCATED: 3, IN_PROGRESS: 4, COMPLETED: 5 };

    function renderTask() {
      var r = S.get(state.selectedId);
      if (!r) { toast('That request is no longer available'); return renderList(); }
      var L = effLeg(r);
      // Guard: this request must involve me (a current or past leg of mine).
      if (!L) { toast('This task is no longer assigned to you'); return renderList(); }
      var active = isActiveLeg(r);

      state.view = 'task';
      titleEl.textContent = 'Request ' + r.id;
      subEl.textContent = esc(r.flight.number || '') + (r.flight.route ? ' · ' + esc(r.flight.route) : '');
      backBtn.style.display = 'flex';
      window.scrollTo(0, 0);

      var st = slaState(r);
      var excOpen = r.exception && r.exception.status !== 'resolved';
      var handedOff = L.handoff && L.handoff.status === 'done';
      var finalLeg = !!L.isFinal;

      // Header
      var head = '<div class="sag-task-head">'
        + '<div class="sag-task-name">' + esc(r.passenger.name) + '</div>'
        + '<div class="sag-task-sub">' + esc(r.flight.number || '—') + ' · ' + esc(r.flight.route || '')
        +   (r.flight.date ? ' · ' + esc(r.flight.date) : '') + '</div>'
        + '<div class="sag-task-badges">'
        +   '<span class="sag-prio ' + prioClass(r.priority) + '">' + esc(r.priority) + '</span>'
        +   legChip(r, L, active)
        +   (r.flight.boarding ? '<span class="sag-time' + slaClass(st) + '">◷ Boarding ' + esc(r.flight.boarding) + '</span>' : '')
        + '</div></div>';

      // Closed-state banner (handoff done / completed / cancelled)
      var banner = '';
      if (!active) {
        if (r.status === 'CANCELLED') {
          banner = '<div class="sag-done is-cancel"><span class="sag-done-ic" aria-hidden="true">✕</span>'
            + '<div>Cancelled by OCC<div style="font-weight:500;font-size:12.5px;">No further action needed.</div></div></div>';
        } else if (handedOff && r.status === 'AWAITING_ASSIGNMENT') {
          banner = '<div class="sag-done"><span class="sag-done-ic" aria-hidden="true">✓</span>'
            + '<div>Your task is complete.<div style="font-weight:500;font-size:12.5px;">The coordinator will assign the next assistance leg.</div></div></div>';
        } else if (r.status === 'COMPLETED') {
          banner = '<div class="sag-done"><span class="sag-done-ic" aria-hidden="true">✓</span>'
            + '<div>Assistance completed<div style="font-weight:500;font-size:12.5px;">This journey is closed.</div></div></div>';
        } else if (handedOff) {
          banner = '<div class="sag-done"><span class="sag-done-ic" aria-hidden="true">✓</span>'
            + '<div>Your task is complete.<div style="font-weight:500;font-size:12.5px;">The passenger journey has continued.</div></div></div>';
        }
      }

      // "Your task" — the prominent, agent-specific responsibility
      var pickupVal = L.pickup || (r.flight.terminal ? r.flight.terminal + ' — check-in area' : '—');
      var destVal = L.destination || (r.flight.gate ? 'Gate ' + r.flight.gate : '—');
      var taskPanel = '<div class="sag-panel sag-task-panel"><div class="sag-panel-t">Your task</div>'
        + '<div class="sag-task-title">' + esc(L.taskTitle) + '</div>'
        + (L.taskInstruction ? '<div class="sag-task-instr">' + esc(L.taskInstruction) + '</div>' : '')
        + '<div class="sag-task-kv"><span class="sag-tk">Meet passenger at</span><span class="sag-tv">📍 ' + esc(pickupVal) + '</span></div>'
        + '<div class="sag-task-kv"><span class="sag-tk">Assist passenger to</span><span class="sag-tv">🎯 ' + esc(destVal) + '</span></div>'
        + (finalLeg ? '' : '<div class="sag-task-kv"><span class="sag-tk">Hand off at</span><span class="sag-tv">🤝 ' + esc(destVal) + '</span></div>')
        + '</div>';

      // Flight & timing context
      var meet = '<div class="sag-panel"><div class="sag-panel-t">Flight &amp; timing</div><div class="sag-meet">'
        + meetRow('🛫', 'Flight', (r.flight.number || '—') + (r.flight.route ? ' · ' + r.flight.route : ''))
        + meetRow('🚪', 'Terminal / gate', (r.flight.terminal || '—') + (r.flight.gate ? ' · Gate ' + r.flight.gate : ''))
        + meetRow('⏱', 'Boarding',
            (r.flight.boarding ? '<span class="sag-time' + slaClass(st) + '">' + esc(r.flight.boarding)
              + (st === 'at_risk' ? ' · running tight' : (st === 'breached' ? ' · overdue' : '')) + '</span>' : '—'), true)
        + '</div></div>';

      // Needs
      var needsHtml = (r.needs || []).map(function (k) {
        var n = S.needByKey(k); if (!n) return '';
        return '<div class="sag-need"><span class="sag-need-ic" aria-hidden="true">' + n.icon + '</span>'
          + '<span class="sag-need-l">' + esc(n.label) + '</span>'
          + '<span class="sag-need-code">' + esc(n.code) + '</span></div>';
      }).join('') || '<div class="sag-note" style="font-style:normal;">No specific needs recorded.</div>';
      var needs = '<div class="sag-panel"><div class="sag-panel-t">What they need</div>'
        + '<div class="sag-needs">' + needsHtml + '</div>'
        + (r.needsNote ? '<p class="sag-note">“' + esc(r.needsNote) + '”</p>' : '')
        + '</div>';

      // Progress stepper for THIS leg. Reached milestones show ✓; the step the
      // primary action completes is highlighted. Last node reflects the leg
      // outcome: "Completed" (final leg) or "Handed off".
      var STEP_LABELS = ['Assigned', 'Accepted', 'On the way', 'Passenger located', 'Assisting', finalLeg ? 'Completed' : 'Handed off'];
      var cur = STATUS_STEP[L.status];
      var nextIdx = (L.status === 'COMPLETED') ? -1 : cur + 1;
      var stepsHtml = STEP_LABELS.map(function (lbl, i) {
        var done = i <= cur;
        var cls = done ? 'is-done' : (i === nextIdx ? 'is-current' : '');
        var mark = done ? '✓' : (i + 1);
        return '<li class="sag-step ' + cls + '"><span class="sag-dot" aria-hidden="true">' + mark + '</span>'
          + '<span class="sag-step-l">' + lbl + '</span></li>';
      }).join('');
      var steps = '<div class="sag-panel"><div class="sag-panel-t">Progress</div><ol class="sag-steps">' + stepsHtml + '</ol></div>';

      // Exception banner / handoff panel / report panel / report trigger
      var extra = '';
      if (excOpen) {
        extra = '<div class="sag-exc"><span aria-hidden="true">⚠</span><div>'
          + '<div class="sag-exc-t">Issue reported: ' + esc(excLabel(r.exception.type)) + '</div>'
          + (r.exception.note ? '<div class="sag-exc-sub">' + esc(r.exception.note) + '</div>' : '')
          + '<div class="sag-exc-sub">The OCC coordinator is handling it.</div>'
          + '</div></div>';
      } else if (active && state.handoffOpen) {
        extra = '<div class="sag-panel sag-report-panel"><div class="sag-panel-t">Hand off passenger</div>'
          + '<p class="sag-note" style="font-style:normal;margin:0 0 12px;">Confirm you have handed the passenger over at '
          +   '<strong>' + esc(L.destination || 'the handoff point') + '</strong>. The coordinator will assign the next agent.</p>'
          + '<div class="input-group"><label class="input-label" for="sag-handoff-note">Handoff note (optional)</label>'
          +   '<input id="sag-handoff-note" class="input-field" placeholder="e.g. Settled at gate, needs boarding help" /></div>'
          + '<div class="sag-report-actions">'
          +   '<button type="button" class="btn-secondary" data-act="handoff-cancel">Cancel</button>'
          +   '<button type="button" class="btn-primary" data-act="handoff-confirm">Confirm handoff</button>'
          + '</div></div>';
      } else if (active && state.reportOpen) {
        var opts = EXC_TYPES.map(function (e) { return '<option value="' + e.v + '">' + esc(e.l) + '</option>'; }).join('');
        extra = '<div class="sag-panel sag-report-panel"><div class="sag-panel-t">Report an issue</div>'
          + '<div class="input-group"><label class="input-label" for="sag-exc-type">What’s wrong?</label>'
          +   '<select id="sag-exc-type" class="input-field">' + opts + '</select></div>'
          + '<div class="input-group"><label class="input-label" for="sag-exc-note">Add a note (optional)</label>'
          +   '<input id="sag-exc-note" class="input-field" placeholder="e.g. Passenger not at check-in" /></div>'
          + '<div class="sag-report-actions">'
          +   '<button type="button" class="btn-secondary" data-act="report-cancel">Cancel</button>'
          +   '<button type="button" class="btn-primary" data-act="report-submit">Report to OCC</button>'
          + '</div></div>';
      } else if (active) {
        extra = '<button type="button" class="sag-report-btn" data-act="report-open">'
          + '<span aria-hidden="true">⚠</span> Report an issue</button>';
      }

      scroll.innerHTML = head + banner + taskPanel + meet + needs + steps + extra;

      // Sticky primary action (hidden while the handoff panel is open — it owns its own confirm)
      if (active && !state.handoffOpen) {
        var na = nextAction(L);
        ctaHost.innerHTML = na
          ? '<div class="sag-cta">'
            + '<button type="button" class="btn-primary" data-act="' + na.fn + '">' + esc(na.label) + '</button>'
            + '<span class="sag-cta-hint">' + esc(na.hint) + '</span></div>'
          : '';
      } else if (!active) {
        ctaHost.innerHTML = '<div class="sag-cta">'
          + '<button type="button" class="btn-secondary" data-act="back">Back to my work</button></div>';
      } else {
        ctaHost.innerHTML = '';
      }

      wire(r, L);
    }

    function meetRow(icon, k, v, isHtml) {
      return '<div class="sag-meet-row"><span class="sag-meet-ic" aria-hidden="true">' + icon + '</span>'
        + '<div><div class="sag-meet-k">' + esc(k) + '</div>'
        + '<div class="sag-meet-v">' + (isHtml ? v : esc(v)) + '</div></div></div>';
    }
    function excLabel(type) {
      var f = EXC_TYPES.filter(function (e) { return e.v === type; })[0];
      return f ? f.l : type;
    }

    /* ---- actions ------------------------------------------------------- */
    function wire(r, L) {
      scroll.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', onAct); });
      ctaHost.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', onAct); });

      function onAct() {
        var act = this.getAttribute('data-act');
        var id = r.id;
        if (act === 'accept')       { S.acceptAssignment(id, ME); toast('Assignment accepted'); }
        else if (act === 'enroute') { S.startEnRoute(id, ME);     toast('Passenger notified you’re on the way'); }
        else if (act === 'locate')  { S.locatePassenger(id, ME);  toast('Passenger located'); }
        else if (act === 'start')   { S.startAssistance(id, ME);  toast('Assistance started'); }
        else if (act === 'complete'){ S.completeAssistance(id, ME); toast('Assistance completed'); }
        else if (act === 'handoff-open')   { state.handoffOpen = true; renderTask(); return; }
        else if (act === 'handoff-cancel') { state.handoffOpen = false; renderTask(); return; }
        else if (act === 'handoff-confirm') {
          var hn = document.getElementById('sag-handoff-note').value.trim();
          S.handoffPassenger(id, hn, ME); state.handoffOpen = false; toast('Passenger handed off');
        }
        else if (act === 'report-open')   { state.reportOpen = true; renderTask(); return; }
        else if (act === 'report-cancel') { state.reportOpen = false; renderTask(); return; }
        else if (act === 'report-submit') {
          var t = document.getElementById('sag-exc-type').value;
          var n = document.getElementById('sag-exc-note').value.trim();
          S.escalate(id, t, n, ME); state.reportOpen = false; toast('Issue reported to OCC');
        }
        else if (act === 'back') { return renderList(); }
        renderTask();
      }
    }

    /* ---- demo identity strip (dev-only) -------------------------------- */
    function renderDemoStrip() {
      var opts = S.AGENTS.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === ME ? ' selected' : '') + '>'
          + esc(a.name) + ' (' + esc(a.id) + ')</option>';
      }).join('');
      demoEl.innerHTML = '<span class="sag-demo-tag">Demo</span>'
        + '<span class="sag-demo-lbl">Signed in as</span>'
        + '<select id="sag-demo-sel" aria-label="Demo: switch agent">' + opts + '</select>';
      document.getElementById('sag-demo-sel').addEventListener('change', function () {
        ME = this.value; setAgent(ME);
        state.view = 'list'; state.selectedId = null;
        renderHeaderMe(); render();
      });
    }
    function renderHeaderMe() {
      var a = me();
      meEl.innerHTML = '<span class="sag-avatar" aria-hidden="true">' + esc(initials(a.name)) + '</span>';
      meEl.setAttribute('title', a.name + ' · ' + a.id);
    }

    /* ---- render orchestration ------------------------------------------ */
    function render() {
      if (state.view === 'task' && state.selectedId) renderTask();
      else renderList();
    }

    var toastTimer = null;
    function toast(msg) {
      var el = document.getElementById('sag-toast');
      el.textContent = msg; el.classList.add('is-show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('is-show'); }, 1800);
    }

    // Demo convenience: if the shared store is empty, seed the SAME canonical
    // requests the OCC module seeds (same store/key — no parallel source), so
    // the multi-agent demo is consistent whichever surface is opened first.
    // Nothing is assigned here — the OCC coordinator assigns each leg live.
    function seedIfEmpty() {
      if (S.all().length > 0) return;
      S.create({
        source: 'seed',
        passenger: { name: 'Mariam Youssef', bookingRef: 'EK4R8T' },
        flight: { number: 'EK 001', route: 'DXB → LHR', terminal: 'Terminal 3', gate: 'B12', date: 'Tue, 11 Aug', boarding: '08:30', journeyType: 'departing' },
        needs: ['wheelchair_push', 'long_walk'], needsNote: 'Prefers early boarding assistance.',
        pickup: 'Terminal 3 — check-in area', destination: 'Gate B12'
      });
      var b = S.create({
        source: 'seed',
        passenger: { name: 'Daniel Okoro', bookingRef: 'EK2M5K' },
        flight: { number: 'EK 072', route: 'DXB → CDG', terminal: 'Terminal 3', gate: 'B22', date: 'Tue, 11 Aug', boarding: '09:10', journeyType: 'departing' },
        needs: ['visual'], needsNote: '', pickup: 'Terminal 3 — check-in area', destination: 'Gate B22'
      });
      S.confirmRequest(b.id, 'coordinator');
      S.escalate(b.id, 'sla_risk', 'Tight connection — boarding soon.', 'coordinator');
    }

    /* ---- boot ---------------------------------------------------------- */
    backBtn.addEventListener('click', renderList);

    // Live: reflect OCC/passenger changes (new assignment, reassign, cancel).
    S.subscribe(function () {
      if (!document.getElementById('sag-app')) return;
      render();
    });

    seedIfEmpty();
    renderDemoStrip();
    renderHeaderMe();
    render();
  })();
  </script>
</body>
</html>
